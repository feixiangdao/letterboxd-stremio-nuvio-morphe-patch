name: Build patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build patch bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle build --stacktrace

      - name: Show build outputs
        run: |
          find . -type f \( -name "*.mpp" -o -name "*.mpe" \) -print
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' | head -n 1)"
          echo "=== MPP MANIFEST ==="
          unzip -p "$MPP" META-INF/MANIFEST.MF || true
          echo "=== MPP CONTENTS ==="
          unzip -l "$MPP" | sed -n '1,120p'

      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: letterboxd-player-bridge
          path: |
            patches/build/libs/*.mpp
            extensions/extension/build/libs/*.mpe
          if-no-files-found: error
