name: Build Douban Player Bridge APK

on:
  push:
    paths:
      - "douban-player-bridge-app/**"
      - ".github/workflows/build-douban-player-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build installable debug APK
        run: gradle -p douban-player-bridge-app :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp douban-player-bridge-app/app/build/outputs/apk/debug/app-debug.apk              dist/DoubanPlayerBridge-0.1.0.apk
          sha256sum dist/DoubanPlayerBridge-0.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DoubanPlayerBridge-0.1.0
          path: dist/DoubanPlayerBridge-0.1.0.apk
          if-no-files-found: error
